name: Mirror / riscv64 (real-world mirror)

# The PR's motivating use case, against the author's own production mirror.
#
# riseproject-dev/python-versions publishes only linux-riscv64 builds (and
# linux-riscv64-freethreaded), so `architecture: riscv64` is what makes the
# manifest lookup match. These are the only jobs that reach a download_url the
# mirror itself designates, rather than one that happens to be upstream.
#
# Both are expected to go RED on a hosted x64 runner, because a riscv64 binary
# cannot execute there. The error is the evidence: it appears after resolution,
# not as "not found for architecture", which is what shows the mirror was read.

on:
  workflow_dispatch:
  push:
    branches: [mirror-test]

env:
  RISCV_MIRROR: 'https://raw.githubusercontent.com/riseproject-dev/python-versions/main'
  PY_VERSION: '3.11.7'
  FT_VERSION: '3.13t'

jobs:
  riscv64:
    # Literal versions: the env context is not available in a job-level `name`.
    name: 'riscv64 3.11.7'
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python from the riscv64 mirror
        uses: riseproject-dev/setup-python@main
        with:
          python-version: ${{ env.PY_VERSION }}
          architecture: 'riscv64'
          mirror: ${{ env.RISCV_MIRROR }}

  riscv64-freethreaded:
    # Free-threaded is a separate arch value in the manifest
    # (`riscv64-freethreaded`), not a flag, so this exercises a different
    # manifest entry rather than the same one twice.
    name: 'riscv64 3.13t'
    runs-on: ubuntu-latest

    steps:
      - name: Set up free-threaded Python from the riscv64 mirror
        uses: riseproject-dev/setup-python@main
        with:
          python-version: ${{ env.FT_VERSION }}
          architecture: 'riscv64'
          mirror: ${{ env.RISCV_MIRROR }}
