name: Mirror / tool-cache short-circuit

# Every combination of {unreachable, working} mirror x {cached, uncached,
# check-latest, old patch}, so the one case that ignores the mirror stands out
# against the seven that do not.
#
#   unreachable + hosted-cache-version -> PASSES   <- the finding
#   unreachable + non-cached           -> fails
#   unreachable + check-latest         -> fails
#   unreachable + old-patch            -> fails
#   working     + all four             -> pass
#
# `.invalid` is reserved by RFC 2606, so DNS can never resolve it. A job that
# survives it never fetched the manifest. That is exactly the shape of the PR's
# own E2E job (3.12, no check-latest), which is why it proves nothing.
#
# No continue-on-error: the four expected failures go red, and setup-python's
# own error is the evidence.

on:
  workflow_dispatch:
  push:
    branches: [mirror-test]

jobs:
  grid:
    name: '${{ matrix.mirror.name }} + ${{ matrix.case.name }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mirror:
          - name: unreachable mirror
            url: 'https://mirror.invalid'
          # Three path segments, so it parses as {owner}/{repo}/{branch} and
          # resolves via the GitHub API without the spurious slash-branch
          # warning the refs/heads/ form produces.
          - name: working mirror
            url: 'https://raw.githubusercontent.com/priyagupta108/python-versions/main'
        case:
          # Preinstalled on the image, so tc.find() answers before the manifest
          # is ever consulted.
          - name: hosted cache version
            version: '3.12'
            latest: false
            prerelease: false
          # 3.15 is prerelease-only (newest 3.15.0-rc.1), so no image ships it
          # and the cache cannot help. allow-prereleases is required or `3.15`
          # matches no stable release.
          - name: non cache
            version: '3.15'
            latest: false
            prerelease: true
          # Resolves against the manifest before consulting the tool cache.
          - name: check-latest
            version: '3.12'
            latest: true
            prerelease: false
          # Old patch (latest 3.11 is 3.11.16), so never tool-cached.
          - name: patch
            version: '3.11.7'
            latest: false
            prerelease: false

    steps:
      - name: Show preinstalled Python tool cache
        shell: bash
        run: |
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          ls -1 "$RUNNER_TOOL_CACHE/Python" 2>/dev/null || echo "(no Python tool cache directory)"

      - name: Set up Python
        uses: riseproject-dev/setup-python@0d1135ac814405808323d2060134097ba5fd641b
        with:
          python-version: ${{ matrix.case.version }}
          mirror: ${{ matrix.mirror.url }}
          check-latest: ${{ matrix.case.latest }}
          allow-prereleases: ${{ matrix.case.prerelease }}

      - name: Report resolved interpreter
        shell: bash
        run: |
          exe=$(python -c 'import sys; print(sys.executable)')
          version=$(python -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')
          echo "resolved=$version"
          echo "sys.executable=$exe"
          echo "- \`${{ matrix.mirror.name }}\` + \`${{ matrix.case.name }}\` -> \`$version\`" >> "$GITHUB_STEP_SUMMARY"
          norm() { printf '%s' "$1" | tr 'A-Z\\' 'a-z/'; }
          case "$(norm "$exe")" in
            "$(norm "$RUNNER_TOOL_CACHE")"*)
              echo "came from the runner tool cache" ;;
            *)
              echo "interpreter is outside RUNNER_TOOL_CACHE, so it was downloaded" ;;
          esac
