name: Mirror / tool-cache short-circuit

# Evidence for the review point that `setup-versions-via-mirror-input` does not
# exercise the mirror.
#
# The method is an A/B pair. Two jobs run the PR's exact job shape and differ in
# exactly one character of input: one gets a working mirror, the other a mirror
# that cannot possibly resolve (`.invalid` is reserved by RFC 2606, so DNS
# always fails). Both are expected to pass, and to land on the same interpreter.
# An input that makes no difference when it is broken is an input the job never
# used.
#
# The remaining jobs flip one input at a time to show what turns it back into a
# real test.

on:
  workflow_dispatch:
  push:
    branches: [mirror-test]

env:
  UNREACHABLE_MIRROR: 'https://mirror.invalid'
  WORKING_MIRROR: 'https://raw.githubusercontent.com/actions/python-versions/refs/heads/main'

jobs:
  as-written-is-vacuous:
    # Reproduces the PR's job: python-version 3.12, no check-latest, against a
    # mirror that cannot resolve. Passing IS the finding, so no assertion is
    # needed. If it goes red, the premise did not hold — 3.12 was not tool-cached
    # on that image — and setup-python's own DNS error says so.
    #
    # Deliberately step-for-step identical to as-written-with-working-mirror;
    # the mirror value is the only difference between the two jobs.
    name: 'As written, unreachable mirror / ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - ubuntu-24.04-arm
          - windows-11-arm

    steps:
      - name: Show preinstalled Python tool cache
        shell: bash
        run: |
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          ls -1 "$RUNNER_TOOL_CACHE/Python" 2>/dev/null || echo "(no Python tool cache directory)"

      - name: Set up Python 3.12 with an unresolvable mirror
        uses: riseproject-dev/setup-python@0d1135ac814405808323d2060134097ba5fd641b
        with:
          python-version: '3.12'
          mirror: ${{ env.UNREACHABLE_MIRROR }}

      - name: Report resolved interpreter
        shell: bash
        run: |
          exe=$(python -c 'import sys; print(sys.executable)')
          version=$(python -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')
          echo "resolved=$version"
          echo "sys.executable=$exe"
          echo "- \`${{ matrix.os }}\` unreachable mirror -> \`$version\`" >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Reached this step with an unresolvable mirror, so the manifest was never fetched."
          norm() { printf '%s' "$1" | tr 'A-Z\\' 'a-z/'; }
          case "$(norm "$exe")" in
            "$(norm "$RUNNER_TOOL_CACHE")"*)
              echo "resolved from the runner tool cache — tc.find() short-circuited" ;;
            *)
              echo "::warning::interpreter is outside RUNNER_TOOL_CACHE" ;;
          esac

  as-written-with-working-mirror:
    # The control half of the pair: the PR's job exactly as written, against a
    # mirror that actually serves a manifest. Expected to PASS and to resolve
    # the same interpreter as the unreachable-mirror job, which is what shows
    # the outcome does not depend on the mirror at all.
    name: 'As written, working mirror / ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - ubuntu-24.04-arm
          - windows-11-arm

    steps:
      - name: Set up Python 3.12 with a working mirror
        uses: riseproject-dev/setup-python@0d1135ac814405808323d2060134097ba5fd641b
        with:
          python-version: '3.12'
          mirror: ${{ env.WORKING_MIRROR }}

      - name: Report resolved interpreter
        shell: bash
        run: |
          exe=$(python -c 'import sys; print(sys.executable)')
          version=$(python -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')
          echo "resolved=$version"
          echo "sys.executable=$exe"
          # Compare this against the unreachable-mirror job: same version, same
          # tool-cache path, opposite mirror.
          echo "- \`${{ matrix.os }}\` working mirror -> \`$version\`" >> "$GITHUB_STEP_SUMMARY"
          norm() { printf '%s' "$1" | tr 'A-Z\\' 'a-z/'; }
          case "$(norm "$exe")" in
            "$(norm "$RUNNER_TOOL_CACHE")"*)
              echo "::warning::Resolved from the tool cache even with a working mirror — the manifest was not consulted here either." ;;
            *)
              echo "interpreter is outside RUNNER_TOOL_CACHE, so this one really was downloaded" ;;
          esac

  check-latest-forces-resolution:
    # Same inputs plus check-latest, which resolves against the manifest before
    # consulting the tool cache. Expected to FAIL, proving the mirror is now on
    # the critical path.
    name: 'check-latest reaches the mirror / ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Set up Python 3.12 with check-latest and an unresolvable mirror
        id: setup
        continue-on-error: true
        uses: riseproject-dev/setup-python@0d1135ac814405808323d2060134097ba5fd641b
        with:
          python-version: '3.12'
          mirror: ${{ env.UNREACHABLE_MIRROR }}
          check-latest: true

      - name: Assert it failed
        shell: bash
        run: |
          echo "outcome=${{ steps.setup.outcome }}"
          if [ "${{ steps.setup.outcome }}" != "failure" ]; then
            echo "::error::expected failure — check-latest did not force a manifest fetch"
            exit 1
          fi
          echo "check-latest forced manifest resolution, so the unreachable mirror broke the run as it should"

  uncached-version-forces-resolution:
    # The other way to make the job real, without check-latest: ask for a patch
    # the image does not ship. 3.11.7 is old enough never to be tool-cached
    # (latest 3.11 is 3.11.16). Expected to FAIL.
    name: 'Uncached patch reaches the mirror / ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Set up an uncached patch with an unresolvable mirror
        id: setup
        continue-on-error: true
        uses: riseproject-dev/setup-python@0d1135ac814405808323d2060134097ba5fd641b
        with:
          python-version: '3.11.7'
          mirror: ${{ env.UNREACHABLE_MIRROR }}

      - name: Assert it failed
        shell: bash
        run: |
          echo "outcome=${{ steps.setup.outcome }}"
          if [ "${{ steps.setup.outcome }}" != "failure" ]; then
            echo "::error::expected failure — an uncached patch should have required the manifest"
            exit 1
          fi

  proposed-job-shape:
    # The working-mirror half of the check-latest A/B: identical inputs to
    # `check-latest-forces-resolution`, differing only in the mirror. That job
    # must fail and this one must pass — the outcome now depends on the mirror,
    # which is exactly what the job as written fails to achieve.
    #
    # Asserting only "3.12.x" would be vacuous again, since the cached
    # interpreter satisfies it too. So when the manifest's newest 3.12 differs
    # from the one baked into the image, this asserts the manifest's answer won.
    name: 'Proposed job shape / ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Record the preinstalled 3.12 patch
        shell: bash
        run: |
          cached=$(ls -1 "$RUNNER_TOOL_CACHE/Python" 2>/dev/null \
            | grep -E '^3\.12\.[0-9]+$' | sort -t. -k3 -n | tail -1)
          echo "cached_312=${cached:-none}" >> "$GITHUB_ENV"
          echo "preinstalled 3.12 in tool cache: ${cached:-none}"

      - name: Resolve the manifest's newest 3.12 for this platform
        shell: bash
        run: |
          # The newest patch is not built for every platform — 3.12.14 is
          # Linux-only — so this must be filtered per platform/arch, or Windows
          # and macOS fail for a reason that has nothing to do with the mirror.
          case "$RUNNER_OS" in
            Linux)   plat=linux ;;
            Windows) plat=win32 ;;
            macOS)   plat=darwin ;;
            *) echo "::error::unknown RUNNER_OS=$RUNNER_OS"; exit 1 ;;
          esac
          arch=$(printf '%s' "$RUNNER_ARCH" | tr 'A-Z' 'a-z')
          latest=$(curl -sSL "$WORKING_MIRROR/versions-manifest.json" \
            | jq -r --arg plat "$plat" --arg arch "$arch" '
                [ .[]
                  | select(.stable)
                  | select(.version | test("^3\\.12\\.[0-9]+$"))
                  | select(any(.files[]; .platform == $plat and .arch == $arch and ((.filename // "") | test("freethreaded") | not)))
                  | .version ]
                | max_by(split(".")[2] | tonumber) // "none"')
          echo "manifest_312=$latest" >> "$GITHUB_ENV"
          echo "newest 3.12 for $plat-$arch: $latest"

      - name: Set up Python via mirror with check-latest
        uses: riseproject-dev/setup-python@0d1135ac814405808323d2060134097ba5fd641b
        with:
          python-version: '3.12'
          mirror: ${{ env.WORKING_MIRROR }}
          check-latest: true

      - name: Assert the manifest decided the version
        shell: bash
        run: |
          actual=$(python -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')
          echo "resolved=$actual  cached=$cached_312  manifest=$manifest_312"
          echo "- \`${{ matrix.os }}\` cached=\`$cached_312\` manifest=\`$manifest_312\` resolved=\`$actual\`" >> "$GITHUB_STEP_SUMMARY"

          case "$actual" in
            3.12.*) ;;
            *) echo "::error::expected 3.12.x, got $actual"; exit 1 ;;
          esac

          if [ "$manifest_312" = "none" ]; then
            echo "::error::could not read a 3.12 version from the mirror manifest"
            exit 1
          fi

          if [ "$cached_312" = "$manifest_312" ]; then
            # Image already ships the manifest's newest 3.12, so resolving from
            # either source looks identical. Inconclusive rather than passing.
            echo "::notice::Image ships $cached_312, the same version the manifest offers — this image cannot distinguish the two sources."
          elif [ "$actual" = "$manifest_312" ]; then
            echo "check-latest took the manifest's answer ($manifest_312) over the cached $cached_312"
          else
            echo "::error::resolved $actual but the manifest offers $manifest_312 — check-latest did not use the mirror"
            exit 1
          fi
