name: Mirror / warnings

# core.warning() output is only assertable through the check-run annotations
# API, so the warning cases live here rather than being scattered across the
# other workflows.

on:
  workflow_dispatch:
  push:
    branches: [mirror-test]

permissions:
  contents: read
  actions: read
  checks: read

env:
  FORK_MIRROR: 'https://raw.githubusercontent.com/priyagupta108/python-versions/main'

jobs:
  pypy-with-mirror:
    # `mirror` is ignored for PyPy, which resolves from downloads.python.org.
    # It must warn and still install.
    name: 'PyPy with mirror'
    runs-on: ubuntu-latest
    steps:
      - name: Set up PyPy with a mirror set
        uses: riseproject-dev/setup-python@main
        with:
          python-version: 'pypy3.10'
          mirror: ${{ env.FORK_MIRROR }}

      - name: Assert PyPy installed anyway
        shell: bash
        run: python -c 'import sys; print(sys.implementation.name, sys.version)'

  graalpy-with-mirror:
    # Same for GraalPy, which resolves from the GitHub releases API.
    name: 'GraalPy with mirror'
    runs-on: ubuntu-latest
    steps:
      - name: Set up GraalPy with a mirror set
        uses: riseproject-dev/setup-python@main
        with:
          python-version: 'graalpy-24.0'
          mirror: ${{ env.FORK_MIRROR }}

      - name: Assert GraalPy installed anyway
        shell: bash
        run: python -c 'import sys; print(sys.implementation.name, sys.version)'

  pypy-without-mirror:
    # Control for pypy-with-mirror: with no mirror input the warning must not
    # fire. Without this job, a warning that fired unconditionally would still
    # satisfy the with-mirror check.
    name: 'PyPy without mirror'
    runs-on: ubuntu-latest
    steps:
      - name: Set up PyPy without a mirror
        uses: riseproject-dev/setup-python@main
        with:
          python-version: 'pypy3.10'
         
      - name: Assert PyPy installed anyway
        shell: bash
        run: python -c 'import sys; print(sys.implementation.name, sys.version)'

  graalpy-without-mirror:
    # Control for graalpy-with-mirror, as above.
    name: 'GraalPy without mirror'
    runs-on: ubuntu-latest
    steps:
      - name: Set up GraalPy without a mirror
        uses: riseproject-dev/setup-python@main
        with:
          python-version: 'graalpy-24.0'
         

      - name: Assert GraalPy installed anyway
        shell: bash
        run: python -c 'import sys; print(sys.implementation.name, sys.version)'


  refs-heads-mirror:
    # refs/heads/main is a legitimate raw.githubusercontent.com form, but it
    # does not match {owner}/{repo}/{branch}, so it drops to the direct-URL
    # fetch and warns about slashes in branch names. Worth deciding whether that
    # warning should fire for a URL that contains no branch slash at all — the
    # PR's own E2E job uses exactly this value.
    name: 'Mirror with refs/heads URL'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python via refs/heads form
        uses: riseproject-dev/setup-python@main
        with:
          python-version: '3.11.7'
          mirror: 'https://raw.githubusercontent.com/priyagupta108/python-versions/refs/heads/main'

      - name: Assert resolved version
        shell: bash
        run: |
          actual=$(python -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')
          echo "resolved=$actual"
          if [ "$actual" != "3.11.7" ]; then
            echo "::error::expected 3.11.7, got $actual"
            exit 1
          fi

  assert-annotations:
    name: 'Assert warning annotations'
    runs-on: ubuntu-latest
    needs: [pypy-with-mirror, graalpy-with-mirror, pypy-without-mirror, graalpy-without-mirror, refs-heads-mirror]
    steps:
      - name: Collect annotations per job
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Keyed by job name. Flattening every annotation into one file can
          # only assert presence, and presence is satisfied by any job — so a
          # warning that fires unconditionally would look correct.
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | "\(.id)\t\(.name)"' > jobs.tsv
          : > annotations.tsv
          while IFS=$'\t' read -r id name; do
            # `gh api` has no --arg, so the job name is prefixed in the shell.
            gh api "/repos/$GITHUB_REPOSITORY/check-runs/$id/annotations" \
              --jq '.[] | "\(.annotation_level)\t\(.message)"' \
            | while IFS= read -r line; do
                printf '%s\t%s\n' "$name" "$line" >> annotations.tsv
              done
          done < jobs.tsv
          echo "--- annotations ---"
          cat annotations.tsv
          # An empty file would make every expect_silent below pass vacuously,
          # which is how a broken collection step looks like a green suite.
          if [ ! -s annotations.tsv ]; then
            echo "::error::no annotations collected; the assertions would be vacuous"
            exit 1
          fi

      - name: Assert warnings fire only where expected
        shell: bash
        run: |
          set -uo pipefail
          failed=0

          # in_job <exact job name> <substring> -> 0 if that job emitted it
          in_job() {
            awk -F'\t' -v job="$1" -v want="$2" \
              '$1 == job && index($3, want) { found = 1 } END { exit found ? 0 : 1 }' \
              annotations.tsv
          }

          expect_warns() {
            if in_job "$1" "$2"; then
              echo "ok: '$1' warned"
            else
              echo "::error::'$1' did not emit expected warning: $2"
              failed=1
            fi
          }

          expect_silent() {
            if in_job "$1" "$2"; then
              echo "::error::'$1' warned about 'mirror' even though no mirror input was set"
              failed=1
            else
              echo "ok: '$1' did not warn, which is correct with no mirror input"
            fi
          }

          expect_warns  "PyPy with mirror"           "is ignored for PyPy"
          expect_warns  "GraalPy with mirror"        "is ignored for GraalPy"
          expect_warns  "Mirror with refs/heads URL" "Branch names containing '/' are not supported"

          # The guard is `if (!core.getInput('mirror')) return;`. If it never
          # trips, every PyPy/GraalPy run warns and the expect_warns checks above
          # still pass — these are what catch that.
          expect_silent "PyPy without mirror"     "only applies to CPython"
          expect_silent "GraalPy without mirror"  "only applies to CPython"

          exit "$failed"
